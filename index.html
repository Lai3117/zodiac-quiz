<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 流年測驗｜12星座的2026-2033</title>
<meta name="description" content="測測你的2026年流年主題，只需3個問題，1分鐘解鎖你的年度關鍵字。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #B8D4E8;
    --deep: #1A2744;
    --gold: #C9A84C;
    --cream: #F7F3EE;
    --mist: #E8EFF5;
    --accent: #7B9BB5;
    --text: #2C3E50;
    --soft: #8A9BB0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Sky background */
  .sky-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #c9dff0 0%, #e8f2f9 40%, #F7F3EE 100%);
    z-index: -1;
  }

  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 40%;
    z-index: -1;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: var(--deep);
    border-radius: 50%;
    opacity: 0.3;
    animation: twinkle 3s infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; }
    50% { opacity: 0.5; }
  }

  /* Main container */
  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 2rem 0 1.5rem;
    animation: fadeDown 0.8s ease both;
  }

  .header-badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    font-weight: 500;
  }

  .header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 900;
    color: var(--deep);
    line-height: 1.3;
    margin-bottom: 0.5rem;
  }

  .header h1 span {
    color: var(--gold);
  }

  .header p {
    font-size: 14px;
    color: var(--soft);
    line-height: 1.7;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Progress */
  .progress-wrap {
    margin-bottom: 1.75rem;
    animation: fadeIn 0.6s ease 0.3s both;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--soft);
    margin-bottom: 8px;
  }

  .progress-bar {
    height: 3px;
    background: rgba(26,39,68,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* Card */
  .card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 8px 40px rgba(26,39,68,0.08), 0 2px 8px rgba(26,39,68,0.04);
    animation: fadeUp 0.6s ease both;
    flex: 1;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Step */
  .step { display: none; }
  .step.active { display: block; }

  /* Welcome screen */
  .welcome-icon {
    width: 72px; height: 72px;
    margin: 0 auto 1.5rem;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--sky), var(--mist));
    border-radius: 50%;
    font-size: 32px;
  }

  .welcome-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--deep);
    text-align: center;
    margin-bottom: 0.75rem;
    line-height: 1.4;
  }

  .welcome-desc {
    font-size: 14px;
    color: var(--soft);
    text-align: center;
    line-height: 1.8;
    margin-bottom: 2rem;
  }

  .welcome-tags {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 2rem;
  }

  .tag {
    font-size: 12px;
    padding: 4px 12px;
    background: var(--mist);
    border-radius: 20px;
    color: var(--accent);
    font-weight: 500;
  }

  /* Question */
  .q-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
    margin-bottom: 0.5rem;
  }

  .q-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--deep);
    line-height: 1.5;
    margin-bottom: 1.5rem;
  }

  /* Sign grid */
  .sign-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 1.75rem;
  }

  .sign-btn {
    background: var(--mist);
    border: 1.5px solid transparent;
    border-radius: 12px;
    padding: 10px 4px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px;
    color: var(--text);
    text-align: center;
    transition: all 0.2s ease;
    line-height: 1.3;
  }

  .sign-btn .sign-emoji { display: block; font-size: 18px; margin-bottom: 3px; }

  .sign-btn:hover {
    background: white;
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(26,39,68,0.1);
  }

  .sign-btn.selected {
    background: var(--deep);
    border-color: var(--deep);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(26,39,68,0.25);
  }

  /* Options */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.75rem; }

  .opt {
    background: var(--mist);
    border: 1.5px solid transparent;
    border-radius: 14px;
    padding: 16px 14px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    color: var(--text);
    text-align: left;
    transition: all 0.2s ease;
    line-height: 1.5;
  }

  .opt .opt-emoji { font-size: 22px; display: block; margin-bottom: 6px; }
  .opt .opt-sub { font-size: 11px; color: var(--soft); display: block; margin-top: 3px; }

  .opt:hover {
    background: white;
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(26,39,68,0.08);
  }

  .opt.selected {
    background: var(--deep);
    border-color: var(--deep);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(26,39,68,0.25);
  }

  .opt.selected .opt-sub { color: rgba(255,255,255,0.6); }

  /* Button */
  .btn-wrap { display: flex; justify-content: flex-end; }

  .btn-next {
    background: var(--deep);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 12px 28px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex; align-items: center; gap: 8px;
  }

  .btn-next:hover:not(:disabled) {
    background: #2A3B5C;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(26,39,68,0.25);
  }

  .btn-next:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-start {
    width: 100%;
    background: linear-gradient(135deg, var(--deep), #2A3B5C);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 16px 28px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.05em;
  }

  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(26,39,68,0.3);
  }

  /* Result */
  .result-header {
    text-align: center;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid rgba(26,39,68,0.08);
    margin-bottom: 1.5rem;
  }

  .result-sign-name {
    font-size: 13px;
    color: var(--soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .result-keyword {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(36px, 12vw, 56px);
    font-weight: 900;
    color: var(--deep);
    line-height: 1;
    margin-bottom: 8px;
  }

  .result-keyword span { color: var(--gold); }

  .result-theme {
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
  }

  .result-body {
    font-size: 14px;
    color: var(--text);
    line-height: 1.9;
    margin-bottom: 1.5rem;
  }

  .result-tags {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }

  .result-tag {
    font-size: 12px;
    padding: 4px 12px;
    background: var(--mist);
    border-radius: 20px;
    color: var(--accent);
    font-weight: 500;
  }

  /* CTA */
  .cta-box {
    background: linear-gradient(135deg, var(--deep) 0%, #2A3B5C 100%);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    position: relative;
    overflow: hidden;
  }

  .cta-box::before {
    content: '✦';
    position: absolute;
    top: -10px; right: 20px;
    font-size: 80px;
    color: rgba(255,255,255,0.04);
    pointer-events: none;
  }

  .cta-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    font-weight: 600;
    color: white;
    margin-bottom: 6px;
  }

  .cta-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    line-height: 1.7;
    margin-bottom: 1.25rem;
  }

  .cta-btn {
    display: inline-block;
    background: var(--gold);
    color: var(--deep);
    border: none;
    border-radius: 50px;
    padding: 11px 22px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .cta-btn:hover {
    background: #D4AF5A;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(201,168,76,0.4);
  }

  .retry-btn {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(26,39,68,0.15);
    border-radius: 50px;
    padding: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    color: var(--soft);
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 4px;
  }

  .retry-btn:hover { background: var(--mist); color: var(--text); }

  /* Footer */
  .footer {
    text-align: center;
    padding-top: 2rem;
    font-size: 12px;
    color: var(--soft);
  }

  .footer a { color: var(--accent); text-decoration: none; }

  /* Divider */
  .divider {
    text-align: center;
    font-size: 20px;
    color: var(--gold);
    margin: 1rem 0;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="sky-bg"></div>
<div class="stars" id="stars"></div>

<div class="container">
  <header class="header">
    <div class="header-badge">@laiwingkwan</div>
    <h1>2026 流年<span>測驗</span></h1>
    <p>3個問題 × 1分鐘<br>解鎖你的2026年關鍵主題</p>
  </header>

  <div class="progress-wrap" id="progress-wrap" style="display:none">
    <div class="progress-meta">
      <span id="step-label">第 1 題，共 3 題</span>
      <span id="step-pct">33%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:33%"></div></div>
  </div>

  <div class="card">

    <!-- Step 0: Welcome -->
    <div class="step active" id="s0">
      <div class="welcome-icon">✦</div>
      <div class="welcome-title">你的2026年<br>藏著什麼秘密？</div>
      <p class="welcome-desc">行星正在移動<br>每個星座都有一個2026年的關鍵字<br>你的是什麼？</p>
      <div class="welcome-tags">
        <span class="tag">木星巨蟹座</span>
        <span class="tag">土星白羊座</span>
        <span class="tag">天王星雙子座</span>
      </div>
      <button class="btn-start" onclick="goTo(1)">開始測驗 →</button>
    </div>

    <!-- Step 1: Sign -->
    <div class="step" id="s1">
      <div class="q-label">問題 1 / 3</div>
      <div class="q-title">你是哪個星座？</div>
      <div class="sign-grid" id="sign-grid">
        <button class="sign-btn" data-sign="牡羊座" onclick="selectSign(this)"><span class="sign-emoji">♈</span>牡羊座</button>
        <button class="sign-btn" data-sign="金牛座" onclick="selectSign(this)"><span class="sign-emoji">♉</span>金牛座</button>
        <button class="sign-btn" data-sign="雙子座" onclick="selectSign(this)"><span class="sign-emoji">♊</span>雙子座</button>
        <button class="sign-btn" data-sign="巨蟹座" onclick="selectSign(this)"><span class="sign-emoji">♋</span>巨蟹座</button>
        <button class="sign-btn" data-sign="獅子座" onclick="selectSign(this)"><span class="sign-emoji">♌</span>獅子座</button>
        <button class="sign-btn" data-sign="處女座" onclick="selectSign(this)"><span class="sign-emoji">♍</span>處女座</button>
        <button class="sign-btn" data-sign="天秤座" onclick="selectSign(this)"><span class="sign-emoji">♎</span>天秤座</button>
        <button class="sign-btn" data-sign="天蠍座" onclick="selectSign(this)"><span class="sign-emoji">♏</span>天蠍座</button>
        <button class="sign-btn" data-sign="射手座" onclick="selectSign(this)"><span class="sign-emoji">♐</span>射手座</button>
        <button class="sign-btn" data-sign="摩羯座" onclick="selectSign(this)"><span class="sign-emoji">♑</span>摩羯座</button>
        <button class="sign-btn" data-sign="水瓶座" onclick="selectSign(this)"><span class="sign-emoji">♒</span>水瓶座</button>
        <button class="sign-btn" data-sign="雙魚座" onclick="selectSign(this)"><span class="sign-emoji">♓</span>雙魚座</button>
      </div>
      <div class="btn-wrap">
        <button class="btn-next" id="next1" disabled onclick="goTo(2)">下一題 →</button>
      </div>
    </div>

    <!-- Step 2: Focus -->
    <div class="step" id="s2">
      <div class="q-label">問題 2 / 3</div>
      <div class="q-title">2026年你最在乎哪一塊？</div>
      <div class="opts" id="opts2">
        <button class="opt" data-v="career" onclick="selectOpt(this,'opts2','next2')">
          <span class="opt-emoji">💼</span>
          事業與財富
          <span class="opt-sub">突破、升遷、收入</span>
        </button>
        <button class="opt" data-v="love" onclick="selectOpt(this,'opts2','next2')">
          <span class="opt-emoji">💫</span>
          感情與關係
          <span class="opt-sub">緣分、婚戀、家庭</span>
        </button>
        <button class="opt" data-v="health" onclick="selectOpt(this,'opts2','next2')">
          <span class="opt-emoji">🌿</span>
          健康與能量
          <span class="opt-sub">體力、心態、療癒</span>
        </button>
        <button class="opt" data-v="growth" onclick="selectOpt(this,'opts2','next2')">
          <span class="opt-emoji">✨</span>
          成長與自我
          <span class="opt-sub">學習、轉變、靈性</span>
        </button>
      </div>
      <div class="btn-wrap">
        <button class="btn-next" id="next2" disabled onclick="goTo(3)">下一題 →</button>
      </div>
    </div>

    <!-- Step 3: Style -->
    <div class="step" id="s3">
      <div class="q-label">問題 3 / 3</div>
      <div class="q-title">面對未知，你通常會？</div>
      <div class="opts" id="opts3">
        <button class="opt" data-v="action" onclick="selectOpt(this,'opts3','next3')">
          <span class="opt-emoji">⚡</span>
          直接行動
          <span class="opt-sub">先做再說，調整再來</span>
        </button>
        <button class="opt" data-v="plan" onclick="selectOpt(this,'opts3','next3')">
          <span class="opt-emoji">🗺</span>
          仔細規劃
          <span class="opt-sub">想清楚才出手</span>
        </button>
        <button class="opt" data-v="feel" onclick="selectOpt(this,'opts3','next3')">
          <span class="opt-emoji">🌊</span>
          跟著感覺
          <span class="opt-sub">直覺帶路，隨機應變</span>
        </button>
        <button class="opt" data-v="wait" onclick="selectOpt(this,'opts3','next3')">
          <span class="opt-emoji">🦅</span>
          觀察等待
          <span class="opt-sub">看準時機再出手</span>
        </button>
      </div>
      <div class="btn-wrap">
        <button class="btn-next" id="next3" disabled onclick="showResult()">查看結果 →</button>
      </div>
    </div>

    <!-- Step 4: Result -->
    <div class="step" id="s4"></div>

  </div><!-- end card -->

  <div class="footer">
    <p>《12星座的2026-2033》by <a href="https://instagram.com/laiwingkwan" target="_blank">@laiwingkwan</a></p>
  </div>
</div>

<script>
// Stars
const starsEl = document.getElementById('stars');
for(let i=0;i<40;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
  starsEl.appendChild(s);
}

const answers={sign:'',focus:'',style:''};

const results={
  牡羊座:{

    career:{text:'土星海王星同時入主你的星座，2026是把想法變行動的一年。那個放在備忘錄裡一年的計劃，今年必須動起來。行動比完美重要，先出發，再調整。',tags:['行動力','目標設定','突破框架']},

    growth:{text:'海王星為你注入靈性與同理心，土星則要求落地實踐。2026年你最大的成長，是把抽象的理想變成具體可執行的方向。',tags:['靈性成長','自我探索','落地行動']}
  },
  金牛座:{
    keyword:'蛻變',
    career:{text:'天王星離開命宮，進入財帛宮，財務與賺錢方式迎來革新。那個你一直不敢嘗試的副業或投資方向，2026年是時候認真研究了。',tags:['財務革新','副業','新收入']},
    love:{text:'潛意識宮位受土海影響，過去的情感課題浮現，適合深度療癒。木星帶來溝通宮的開放，兄弟姊妹或朋友是你今年的感情貴人。',tags:['療癒','深度連結','朋友介紹']},
    health:{text:'消化系統需要關注，規律飲食比健身更重要。心理層面同樣需要梳理，考慮冥想或身心靈課程。',tags:['飲食規律','身心靈','梳理情緒']},

function goTo(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('s'+n).classList.add('active');
  const pw=document.getElementById('progress-wrap');
  if(n===0){pw.style.display='none';}
  else if(n<=3){
    pw.style.display='block';
    const pct=Math.round(n/3*100);
    document.getElementById('progress-fill').style.width=pct+'%';
    document.getElementById('step-label').textContent='第 '+n+' 題，共 3 題';
    document.getElementById('step-pct').textContent=pct+'%';
  } else {
    pw.style.display='none';
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function selectSign(btn){
  document.querySelectorAll('#sign-grid .sign-btn').forEach(b=>b.classList.remove('selected'));

  document.getElementById('next1').disabled=false;
}

function selectOpt(btn,gridId,nextId){
  document.querySelectorAll('#'+gridId+' .opt').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  if(gridId==='opts2') answers.focus=btn.dataset.v;
  else answers.style=btn.dataset.v;
  document.getElementById(nextId).disabled=false;
}
